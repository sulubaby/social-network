services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Read by internal/app/tokens/tokens.go — set a real secret in
      # production, e.g. via a .env file or `docker compose --env-file`.
      - ORBIT_TOKEN_SECRET=${ORBIT_TOKEN_SECRET:-change-me-in-production}
    volumes:
      # Persist the sqlite database across container restarts
      - db-data:/app/db
      # Persist user-uploaded media (avatars, post images, ...)
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads-data: