services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-backend
    restart: unless-stopped
    environment:
      - ORBIT_TOKEN_SECRET=${ORBIT_TOKEN_SECRET:-}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
    volumes:
      - ./db:/app/db            # SQLite database + token signature
      - ./uploads:/app/uploads  # user uploads (avatars, posts, chats, ...)
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
